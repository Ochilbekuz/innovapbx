# Innova PBX — `web` konteyneri nginx'i (m3a-contract.md §0/§3). Yagona kelib chiqish:
#   /           — SPA (try_files -> /index.html), /assets/ uzoq kesh (vite xeshli nomlar)
#   /api/       — API (api:8000)
#   = /sip-ws   — WebRTC SIP WebSocket: `auth_request` (ticket, API) -> asterisk:8088/ws
#   /internal/  — tashqaridan 404 (faqat ichki tarmoq; `_ws_auth` subso'rovi `internal`)
# TLS — keyin (produksiyada shu nginx'da). Asterisk HTTP (8088) hostga publish QILINMAYDI.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Docker ichki DNS — konteyner IP'si qayta yaratishda o'zgaradi (o'zgaruvchi orqali proxy_pass
    # har so'rovda qayta hal qiladi; nginx `api`/`asterisk` hali yo'q bo'lsa ham ishga tushadi).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    # INNOVA_ASTERISK_WS — nginx obrazining envsubst shabloni (web/Dockerfile; appliance: host tarmog'idagi Asterisk).
    set $asterisk_ws ${INNOVA_ASTERISK_WS};

    # Xavfsizlik sarlavhalari (server darajasi; quyidagi location'larda `add_header` YO'Q —
    # aks holda nginx ularni meros qilmaydi). Kesh — `expires` bilan (add_header emas).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri /index.html;
        expires -1;  # index.html har doim qayta tekshiriladi (yangi build darhol ko'rinadi)
    }

    location /assets/ {
        try_files $uri =404;
        expires max;
        access_log off;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # chekka proksi: mijoz XFF ustidan yoziladi
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;  # M4a: provizioning URL'i portni saqlasin
        client_max_body_size 25m;  # audio yuklash: API `audio_max_upload_bytes` 20 MiB + multipart
        proxy_read_timeout 120s;
    }

    # M4b §0/§4 — zaxira fayl yuklash (disaster recovery): GB'lab fayl, oqimli. `/api/` dan
    # ANIQROQ (uzunroq prefiks — tartibdan qat'i nazar nginx eng uzunini tanlaydi).
    location /api/v1/backups/upload {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        client_max_body_size 50g;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # M4a §0 — apparat auto-provisioning (autentifikatsiyasiz, token + IP tarmog'i + xato limiti API'da).
    # `add_header` YO'Q (server darajasidagilar meros qolsin); `Cache-Control: no-store` API'dan keladi.
    location /prov/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # chekka proksi: mijoz XFF ustidan yoziladi
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        client_max_body_size 1k;
        access_log off;  # yo'lda token bor — jurnal API'da (`provision_requests`, token `***`)
    }

    location = /sip-ws {
        access_log off;  # ticket query satrida — logga tushmasin
        auth_request /_ws_auth;
        proxy_pass $asterisk_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # chekka proksi: mijoz XFF ustidan yoziladi
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /_ws_auth {
        internal;
        access_log off;
        proxy_pass $api_upstream/internal/softphone/ws-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    location /internal/ {
        return 404;
    }
}
