# Innova PBX — APPLIANCE qatlami (ISO o'rnatish, `iso/`). Asosiy fayl ustidan:
#   docker compose -f docker-compose.yml -f docker-compose.appliance.yml up -d --no-build
#
# Nega: telefonlar LAN'dan SIP (5060) va RTP (10000-20000) bilan to'g'ridan-to'g'ri ulanishi kerak.
# 10 000 RTP portni Docker NAT orqali publish qilish sekin va SDP'da konteyner IP'si chiqadi —
# shuning uchun Asterisk HOST tarmog'ida. Qolganlari `innova-net` da qoladi; ular Asteriskka
# ko'prik shlyuzi (172.30.0.1) orqali, Asterisk esa ularga loopback'dagi portlar orqali ulanadi.
# AMI (5038), Asterisk HTTP (8088) va Postgres tashqaridan YOPIQ: host nftables (`iso/files/nftables.conf`)
# + Postgres faqat 127.0.0.1 ga publish. Obrazlar ISO ichidan yuklanadi (`pull_policy: never`).

x-innova-image: &innova-image
  pull_policy: never

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    <<: *innova-image
    image: innova-pbx/api:${INNOVA_VERSION:-latest}

  asterisk:
    <<: *innova-image
    image: innova-pbx/asterisk:${INNOVA_VERSION:-latest}
    network_mode: host
    hostname: !reset null
    networks: !reset []
    environment:
      POSTGRES_HOST: 127.0.0.1
      # M12 C L8: bazadagi sukut (172.28.0.0/24) appliance uchun to'g'ri EMAS —
      # bu yerda `innova-net` 172.30.0.0/24 ga pin qilingan (yuqorida).
      AMI_PERMIT_CIDR: ${AMI_PERMIT_CIDR:-172.30.0.0/24}

  # M8: `netd` alohida image kerak emas — `api` image'ini qayta ishlatadi
  # (faqat `api`/`asterisk`/`web` ISO ichiga paketlanadi, `install.sh`/`iso/build-iso.sh`).
  netd:
    <<: *innova-image
    image: innova-pbx/api:${INNOVA_VERSION:-latest}

  api:
    <<: *innova-image
    image: innova-pbx/api:${INNOVA_VERSION:-latest}
    environment:
      AMI_HOST: 172.30.0.1
      # Dialplan CURL() — Asterisk host tarmog'ida, API loopback portida.
      INTERNAL_API_BASE_URL: http://127.0.0.1:${API_HOST_PORT:-8710}
      # Paneldan yangilash (m11-update-contract.md): host agenti yozadigan status papkasi.
      INNOVA_VERSION: ${INNOVA_VERSION:-}
      # M12 C L7: bazadagi sukut (172.28.0.0/24) appliance uchun to'g'ri EMAS —
      # bu yerda `innova-net` quyida 172.30.0.0/24 ga pin qilingan.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.30.0.0/24}
    volumes:
      # H1c: API konteyneri status/history/update.log/changelog.md'ni FAQAT
      # o'qiydi (`app/services/system_update.py`); yozadigan yagona narsa —
      # `req/request` (paneldan so'rov). Shu sabab ota papka `:ro`, `req/`
      # esa (install.sh oldindan yaratadi) alohida `rw` bog'lanadi — ichki
      # bog'lanish ota bog'lanishning `:ro`sidan USTUN keladi (bind-mount
      # ichma-ich bog'lanishda ICHKISI g'alaba qiladi).
      - /var/lib/innova/update:/var/lib/innova/update:ro
      - /var/lib/innova/update/req:/var/lib/innova/update/req

  web:
    <<: *innova-image
    image: innova-pbx/web:${INNOVA_VERSION:-latest}
    environment:
      INNOVA_ASTERISK_WS: http://172.30.0.1:8088/ws

# `innova-net` subnet'i 172.30.0.0/24 — `innova-start` INNOVA_NET_SUBNET/GATEWAY
# orqali beradi (base fayldagi ipam; bu yerda qayta yozish compose 2.24'da ro'yxatni qo'shadi).
