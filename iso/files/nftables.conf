#!/usr/sbin/nft -f
# Innova PBX host firewall. `flush ruleset` YO'Q — Docker o'z jadvallarini (NAT, forward) yuritadi.
# Ochiq: SSH, SIP (5060 udp/tcp, 5061 TLS), RTP 10000-20000/udp. Veb (80 va 443, 1.0.4: HTTPS
# softfon mikrofoni uchun) — Docker publish qiladi (DNAT -> forward zanjiri, bu jadvalga tushmaydi).
# Yopiq: AMI 5038, Asterisk HTTP 8088, Postgres, API 8710 — faqat lokal va Docker tarmoqlaridan.

table inet innova
delete table inet innova

table inet innova {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iifname "lo" accept
    # Konteynerlar -> host (web -> Asterisk WS 8088, api -> AMI 5038) — FAQAT `innova-net`
    # subneti (deploy/docker-compose.appliance.yml: 172.30.0.0/24) va shu ikki port.
    # L8 audit (1.0.14): avvalgi "iifname br-*"/"docker0" ISTALGAN docker ko'prigidagi
    # (hatto boshqa, aloqasiz konteyner) manbadan AMI/Asterisk HTTP/Postgres/API (8710)
    # portlariga yo'l ochardi — endi faqat shu ikki aniq port, faqat shu subnetdan.
    ip saddr 172.30.0.0/24 tcp dport { 5038, 8088 } accept

    meta l4proto icmp accept
    meta l4proto ipv6-icmp accept

    tcp dport 22 accept
    tcp dport { 5060, 5061 } accept
    udp dport 5060 accept
    udp dport 10000-20000 accept
  }
}
