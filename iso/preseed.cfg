#_preseed_V1
# Innova PBX — Debian 13 (trixie) avtomatik o'rnatish. ISO ildizida `/preseed.cfg`.
# Faqat ikkita savol qoladi: `innova` foydalanuvchi paroli (ataylab — sir ISO'da saqlanmaydi)
# va DHCP bo'lmasa tarmoq. Disk BUTUNLAY o'chiriladi (o'rnatish muhiti bo'lmagan birinchi disk).

### Til, klaviatura, vaqt
d-i debian-installer/locale string en_US.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string UZ
d-i localechooser/supported-locales multiselect en_US.UTF-8, ru_RU.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Tashkent
d-i clock-setup/ntp boolean true

### Tarmoq (DHCP; statik IP — o'rnatishdan keyin, README)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string innova-pbx
d-i netcfg/get_domain string local
d-i netcfg/hostname string innova-pbx
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

### Oyna (mirror) YO'Q — o'rnatish to'liq oflayn (asos CD'dan, qolgani /innova/debs dan)
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-cdrom-setup/another boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Hisoblar: root yopiq, `innova` sudo orqali. Parol O'RNATISH PAYTIDA so'raladi.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Innova PBX
d-i passwd/username string innova
d-i user-setup/allow-password-weak boolean false
d-i user-setup/encrypt-home boolean false
#INNOVA_TEST_PASSWORD#

### Disk: o'rnatish muhiti bo'lmagan birinchi disk, LVM, bitta bo'lim (+swap)
d-i partman/early_command string \
  for d in $(list-devices disk); do \
    if ! grep -q "^$d" /proc/mounts; then \
      debconf-set partman-auto/disk "$d"; debconf-set grub-installer/bootdev "$d"; break; \
    fi; \
  done
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true

### Paketlar: minimal tizim + SSH. Docker va boshqalar — late_command (lokal ombor)
d-i base-installer/install-recommends boolean false
d-i base-installer/kernel/image string linux-image-amd64
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string openssh-server sudo
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Yuklovchi
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### Innova PBX: Docker, firewall, first-boot servisi
d-i preseed/late_command string sh /cdrom/innova/files/install-target.sh

d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
