; Innova PBX — modul yuklash tartibi.
; `res_config_pgsql` PJSIP realtime (sorcery.conf) uchun res_pjsip o'zidan OLDIN
; tayyor bo'lishi SHART — aks holda "Wizard 'realtime' failed to open mapping"
; xatosi bilan res_pjsip butunlay yuklanmaydi (sinovda topilgan, andrius/asterisk:22,
; Asterisk 22.10.1). Standart hujjat "preload endi kerak emas" deydi — bu PJSIP
; realtime holatiga tegishli emas.
[modules]
autoload=yes
preload = res_config_pgsql.so

noload = res_hep.so
noload = res_hep_pjsip.so
noload = res_hep_rtcp.so
noload = app_voicemail_imap.so
noload = app_voicemail_odbc.so

; M3a §1 — HTTP serveri endi yoqilgan (WebRTC `/ws`); keraksiz HTTP yuzalarini o'chiramiz.
; `res_pjsip_phoneprov_provider` `res_phoneprov`ga bog'liq (yolg'iz yuklanmaydi) — birga.
; `res_prometheus`ga hech qaysi modul bog'liq emas (jonli `module show like` bilan tekshirildi).
; WebRTC uchun kerakli `res_http_websocket`, `res_pjsip_transport_websocket`, `res_srtp`,
; `codec_opus` autoload bilan yuklanadi (jonli tekshirilgan, Asterisk 22.10.1).
noload = res_pjsip_phoneprov_provider.so
noload = res_phoneprov.so
noload = res_prometheus.so

; Xavfsizlik (1.0.12 audit): dialplan'dan OS buyrug'i bajaradigan modullar kerak emas —
; injeksiya bo'lsa ham `System()`/`SHELL()` ishlamasin (defense-in-depth; kodda ishlatilmaydi).
noload = func_shell.so
noload = app_system.so
