; Innova PBX — realtime "oila" (family/jadval) -> drayver xaritasi.
; `sorcery.conf` qaysi sorcery OBYEKTI "realtime" ekanini belgilaydi (masalan
; `endpoint=realtime,ps_endpoints`); SHU oila nomini qaysi drayver (bu yerda
; pgsql) bilan ulashni esa res_pjsip aynan shu faylda (extconfig.conf) qidiradi
; — sorcery.conf'da emas (sinovda tasdiqlangan, aks holda "Wizard 'realtime'
; failed to open mapping" bilan res_pjsip butunlay yuklanmaydi).
[settings]
ps_endpoints => pgsql,innova,ps_endpoints
ps_auths => pgsql,innova,ps_auths
ps_aors => pgsql,innova,ps_aors
ps_endpoint_id_ips => pgsql,innova,ps_endpoint_id_ips
ps_registrations => pgsql,innova,ps_registrations
; M1a — navbatlar (app_queue): realtime, `queue add/remove member` reload talab
; qilmaydi (m1a-contract.md S10). View'lar `alembic/sql/0001_schema.sql`da.
queues => pgsql,innova,asterisk_queues
queue_members => pgsql,innova,asterisk_queue_members
; M2a §0 — DND/yo'naltirish holati: dialplan `REALTIME_FIELD(ext_state,...)` bilan
; o'qiydi, *-kodlar `Set(REALTIME(ext_state,...))` bilan yozadi. View INSTEAD OF
; UPDATE trigger bilan `extensions` jadvalini yangilaydi (0013_m2a_call_features.sql).
ext_state => pgsql,innova,asterisk_ext_state
; M2a §5 — qora ro'yxat: faqat o'qish (API yozadi, reload/apply shart emas).
; `REALTIME_FIELD(blacklist,endpoint,<code>-<raqam>,reason)` bilan o'qiladi.
blacklist => pgsql,innova,asterisk_blacklist
; M2b §0/§1 — navbat agent holati: *45/*46 `REALTIME_FIELD`/`Set(REALTIME(...))`
; bilan o'qiydi/yozadi; view INSTEAD OF UPDATE trigger `queue_members`ni
; cascada qiladi (0015_m2b_agent_state.sql). AstDB/AMI QueueAdd ISHLATILMAYDI —
; PG yagona haqiqat manbai.
agent_state => pgsql,innova,asterisk_agent_state
; M2b §0 — Asterisk `ast_queue_log()` o'zi yozadigan native realtime oila
; (custom AMI tinglovchi SHART EMAS): `queue_log` jadvali 0001_schema.sql'da.
queue_log => pgsql,innova,queue_log
