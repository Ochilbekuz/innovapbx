; Innova PBX — konferensiya (M2a §4). Har konferensiyaning `bridge`/`user`/
; `admin` profillari (nomi, `max_members`, yozib olish) backend
; (`app/services/conference.py`) tomonidan `/srv/dialplan/confbridge_innova.conf`
; ga yoziladi (umumiy docker volume, atomik yozish — `extensions.conf` dagi
; #include bilan BIR XIL qolip) va AMI `module reload app_confbridge.so`
; bilan kuchga kiritiladi. Bu fayl qo'lda tahrirlanmaydi (`[innova-conf-menu]`
; dan BOSHQASI).
;
; `[innova-conf-menu]` — BARCHA konferensiyalar uchun BITTA umumiy DTMF menyu
; (xuddi `[default]` MOH sinfi kabi statik/umumiy): `*1` — o'zini ovozsiz
; qilish/qaytarish (har ishtirokchi o'zini boshqaradi, admin boshqasini emas).
[innova-conf-menu]
type=menu
*1=toggle_mute

#include "/srv/dialplan/confbridge_innova.conf"
