; Innova PBX — ovozli pochta (M1c §2, S23). Umumiy sozlamalar shu yerda,
; qutilar (`[<tenant code>]` konteksti) API generatsiya qiladigan faylda
; (`api/app/services/voicemail.py`), musiconhold.conf/extensions.conf bilan
; BIR XIL #include qolipi. Faylda PIN YO'Q — har qutida terib bo'lmaydigan
; parol; PIN tekshiruvi dialplan `CURL()` -> API, keyin VoiceMailMain(...,s).
[general]
format=wav
; E-mail/Telegram'ni API yuboradi (vm_notify) — Asterisk o'zi xat yubormaydi.
attach=no
maxmsg=100
maxsecs=300
minsecs=1
maxsilence=10
silencethreshold=128
maxlogins=1
review=no
operator=no
saycid=no
sayduration=no
envelope=no
nextaftercmd=yes
moveheard=yes

#include "/srv/dialplan/voicemail_innova.conf"
