; Innova PBX — statik qism (global; transportlar #include orqali). Endpoint/auth/aor/identify/
; registration — sorcery.conf orqali realtime (Postgres, `ps_*` view'lar).
; Faqat ICHKI docker tarmog'ida; hostga SIP/RTP PUBLISH QILINMAYDI
; (deploy/docker-compose.yml'ga qarang).

[global]
; `auth_username` SHART (sinovda topilgan): ko'p-tenant realtime endpoint id'lari
; tenant kodi bilan prefikslangan ("t1-101"), standart "username" strategiyasi
; buni hech qachon topmaydi (REGISTER doim "No matching endpoint found" beradi).
; `auth_username` esa Authorization sarlavhasidagi DIGEST username (ps_auths.username,
; bu ham "t1-101"ga tenglashtirilgan — schema.sql'ga qarang) orqali to'g'ri topadi.
endpoint_identifier_order = ip,auth_username,anonymous
max_initial_qualify_time = 5
default_from_user = innova

; Transportlar (bind port, local_net, tashqi manzil) — API generatsiya qiladi
; (`app/services/sip_transport.py`, S32 sozlamalari). Fayl hali yo'q bo'lsa entrypoint
; image'dagi `pjsip_transports_innova.default.conf` ni qo'yadi.
#include "/srv/dialplan/pjsip_transports_innova.conf"

; M2c §2 — SIP hujum himoyasi (S33): bloklangan IP'lar ro'yxati (global ACL,
; `type=acl` — hech qanday endpoint/identify'da ko'rsatilmasa HAM barcha
; kiruvchi SIP so'roviga qo'llanadi, CTO jonli tasdiqlagan). API `ip_bans`dan
; generatsiya qiladi (`app/services/acl_apply.py`); fayl hali yo'q bo'lsa
; entrypoint bo'sh izoh bilan qo'yadi.
#include "/srv/dialplan/pjsip_acl_innova.conf"
