; Innova PBX — statik qism. MOH sinflari (nomi, fayllar, shuffle) backend
; (`app/services/moh.py`) tomonidan `/srv/dialplan/musiconhold_innova.conf`
; ga yoziladi (umumiy docker volume, `.tmp` + rename — atomik, `extensions.conf`
; dagi #include bilan BIR XIL qolip) va AMI `moh reload` bilan kuchga kiritiladi.
; Bu fayl qo'lda tahrirlanmaydi (`[default]` dan BOSHQASI).
;
; `[default]` — DOIM mavjud, image'ga o'rnatilgan (`make_moh_fallback.py`,
; Dockerfile RUN) haqiqiy fayl bilan. SABAB (haqiqiy Asterisk xatosi,
; 2026-10-28): `res_musiconhold` birinchi marta 0 ishlaydigan sinf bilan
; yuklansa (masalan API hali hech narsa qo'llamagan — birinchi ishga tushish),
; modul butunlay "disabled" holatiga qotib qoladi va oddiy `moh reload`
; (`apply_moh()` ishlatadigani) HECH QACHON tiklanmaydi. `[default]` ham
; `asterisk_queues.musicclass`ning `moh_class_id IS NULL` fallback qiymati
; ("default") bilan BIR XIL nom — navbat hali MOH sinfi biriktirilmagan
; bo'lsa ham kutish musiqasi eshitiladi.
[default]
mode=files
directory=/var/lib/asterisk/moh-fallback

#include "/srv/dialplan/musiconhold_innova.conf"
