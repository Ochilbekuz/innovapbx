; Innova PBX — PJSIP realtime sorcery konfiguratsiyasi.
; Qaror (architecture.md): res_config_pgsql andrius/asterisk:22 obrazida
; mavjud va ishlaydi (tasdiqlangan: `ldd res_config_pgsql.so` libpq'ni
; topadi) — shuning uchun ODBC emas, to'g'ridan-to'g'ri PostgreSQL.
;
; Bu yerda FAQAT qaysi sorcery OBYEKT TURI (endpoint/auth/aor/...) qaysi
; "oila" (family/table) nomi bilan "realtime" wizard orqali olinadi
; belgilanadi. Oila nomi qaysi DRAYVER (pgsql) bilan ulanishi — bu
; `extconfig.conf`'da (SINOVDA TOPILGAN: shu mapping sorcery.conf'da emas,
; aynan extconfig.conf'da bo'lishi SHART, aks holda res_pjsip
; "Wizard 'realtime' failed to open mapping" bilan umuman yuklanmaydi).

[res_pjsip]
endpoint=realtime,ps_endpoints
auth=realtime,ps_auths
aor=realtime,ps_aors

[res_pjsip_endpoint_identifier_ip]
identify=realtime,ps_endpoint_id_ips

[res_pjsip_outbound_registration]
registration=realtime,ps_registrations
