; Innova PBX — statik qism. Tenant kontekstlari (`<code>-from-internal`,
; `<code>-from-trunk`, `<code>-dest-*`) backend kompilyatori tomonidan
; `/srv/dialplan/extensions_innova.conf` ga yoziladi (umumiy docker volume,
; `.tmp` + rename — atomik) va `dialplan reload` (AMI `Reload`,
; Module=pbx_config.so) bilan kuchga kiritiladi. Bu fayl qo'lda tahrirlanmaydi.

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

#include "/srv/dialplan/extensions_innova.conf"
