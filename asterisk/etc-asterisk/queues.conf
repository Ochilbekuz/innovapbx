; Innova PBX — navbatlar umumiy sozlamalari. Navbatlarning o'zi (nomi, strategiya,
; a'zolari) BU FAYLDA EMAS — realtime (`extconfig.conf`: queues/queue_members
; -> asterisk_queues/asterisk_queue_members view'lar), reload shart emas.
[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
shared_lastcall = yes
; M2b §0 — `queue_log` realtime (PostgreSQL): `queue_adaptive_realtime=no`
; har doim data1-data5'ni ALOHIDA USTUN sifatida yozadi (yes bo'lsa
; bitta `data` ustunga "|" bilan birlashtiradi — bizning 0001_schema.sql
; jadval shakli alohida ustunlarni kutadi). Hujjatlanmagan, lekin
; jamoat/manba kodida tasdiqlangan app_queue xususiyati.
queue_adaptive_realtime = no
